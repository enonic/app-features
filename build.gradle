plugins {
    id 'maven-publish'
    id 'com.enonic.defaults' version '2.1.7'
    id 'com.enonic.xp.app'
    id 'com.github.node-gradle.node' version '7.1.0'
}

dependencies {
    implementation xplibs.api.script
    implementation xplibs.api.core
    implementation "com.enonic.xp:portal-api:${xpVersion}"
    include xplibs.auth
    include xplibs.content
    include xplibs.context
    include xplibs.portal
    include xplibs.i18n
    include xplibs.mail
    include xplibs.websocket
    include xplibs.io
    include xplibs.repo
    include xplibs.node
    include xplibs.value
    include xplibs.scheduler
    include xplibs.task
    include xplibs.cluster
    include xplibs.auditlog
    include xplibs.project
    include xplibs.export
    include libs.cron
    include libs.cache
    include libs.cors
    include libs.http.client
    include libs.router
    include libs.thymeleaf
    include libs.mustache
    include libs.xslt
    include libs.text.encoding
    include libs.asset
    include libs.geoip
    include libs.notifications
    include libs.sql
    include libs.h2
    include libs.static
    include libs.recaptcha
    include libs.qrcode
    include libs.markdown
    include "com.enonic.xp:lib-sse:${xpVersion}"

    testImplementation "com.enonic.xp:testing:${xpVersion}"
    testImplementation "org.mockito:mockito-core:5.23.0"
    testImplementation(platform(libs.junit.bom))
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo('dev')
}

node {
    download = true
    version = '22.15.1'
}

test {
    useJUnitPlatform {
    }
}

app {
    // GraalJS is the engine that will replace Nashorn, available as a preview since XP 8.1. It is
    // chosen per application, so this app runs on it while the rest of the installation does not.
    scriptEngine = 'GraalJS'
}

xp {
    // Tests still run on both engines, so a change that only works on one is caught.
    scriptEngines = ['Nashorn', 'GraalJS']
}

processResources {
    exclude '**/.gitkeep'
    exclude '**/*.json'
    exclude '**/*.ts'
    exclude '**/*.tsx'
}

tasks.register('npmBuild', NpmTask) {
    args = ['run', '--silent', 'build']
    dependsOn npmInstall
    environment = [
        'FORCE_COLOR': 'true',
        'NODE_ENV': project.findProperty('env') == 'dev' ? 'development' : 'production'
    ]
    inputs.dir 'src/main/resources'
    outputs.dir 'build/resources/main'
    outputs.upToDateWhen { false }
}

jar.dependsOn npmBuild

tasks.register('npmCheck', NpmTask) {
    dependsOn npmInstall
    args = ['run', 'check']
    environment = ['FORCE_COLOR': 'true']
}

check.dependsOn npmCheck
compileTestJava.dependsOn npmBuild
